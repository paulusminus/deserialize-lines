name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: format
      run: cargo fmt --check --verbose
    - name: clippy
      run: cargo clippy -- -D warnings
    - name: build
      run: cargo build --verbose
    - name: run tests
      run: cargo test --verbose
