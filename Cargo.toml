[package]
authors = ["Paul Min"]
name = "parse-lines"
description = "read and parse lines from anything implementing AsyncBufRead"
edition = "2024"
exclude = [".github/"]
license = "MIT"
repository = "https://github.com/paulusminus/parse-lines"
version = "0.2.0"

[dependencies]
futures-util = { version = "0.3.34", features = ["io"] }
pin-project = "1.1.13"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
